name: Build WF
on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Maven Build
        run: mvn install

    Testing:
      runs-on: ubuntu-latest
      needs: Build
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Maven Test
          run: mvn test

        - name: Checkstyle
          run: mvn checkstyle:checkstyle